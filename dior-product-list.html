<!DOCTYPE html>
<html>
<head>
  <title>Collection Dior</title>
</head>
<body>
  <h1>Catalogue Exclusif</h1>

  <div class="card"><h2>Sac Lady Mini</h2><span>$5,200</span><p>Satin noir brodé perles Cannage</p></div>
  <div class="card"><h2>Miss Dior Parfum</h2><span>$120</span><p>Fragrance florale fraîche</p></div>
  <div class="card"><h2>Diorshow Mascara</h2><span>$29</span><p>Mascara volume intense</p></div>

  <script>
    let xMode = false, xMap = {}, xData = {};
    const filled = v => v !== '' && v != null;

    function load(f) {
      if (xMode && xMap[f]) {
        try {
          let wb = XLSX.read(xData[f], { type: 'base64' }),
              ws = wb.Sheets[wb.SheetNames[0]],
              rows = XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: false, defval: '' }),
              clean = rows.filter(r => r.some(filled)),
              head = clean.findIndex((r, i) => r.filter(filled).length >= (clean[i + 1]?.filter(filled).length || 0));
          if (head === -1 || head > 25) head = 0;
          return XLSX.utils.sheet_to_csv(XLSX.utils.aoa_to_sheet(clean.slice(head)));
        } catch (e) {
          console.error(e); return "";
        }
      }
      return xData[f] || "";
    }
  </script>
</body>
</html>
